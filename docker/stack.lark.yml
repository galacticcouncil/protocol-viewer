version: "3.8"

services:
  web:
    image: galacticcouncil/protocol-viewer:a405aeb-20261013@sha256:68680b286a841fb95665849efef0f2dfa22e43e50395c8d055425c5226c30352
    networks:
      - gateway
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          memory: 32M
      update_config:
        order: start-first
        failure_action: rollback
      labels:
        traefik.enable: "true"
        traefik.docker.network: gateway
        traefik.http.routers.protocol-viewer.rule: Host(`protocol-viewer.lark.hydration.cloud`)
        traefik.http.routers.protocol-viewer.entrypoints: websecure
        traefik.http.routers.protocol-viewer.tls: "true"
        traefik.http.routers.protocol-viewer.tls.certresolver: myresolver
        traefik.http.services.protocol-viewer.loadbalancer.server.port: "8080"

networks:
  gateway:
    external: true
