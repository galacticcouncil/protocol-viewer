name: deploy to lark

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lark
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - uses: docker/setup-buildx-action@v2
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build and publish
        id: image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: galacticcouncil/protocol-viewer:${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
      - name: deploy and verify
        run: node scripts/deploy-lark.mjs
        env:
          SWARMPIT_TOKEN: ${{ secrets.LARK_SWARMPIT_TOKEN }}
          DEPLOY_IMAGE: galacticcouncil/protocol-viewer:${{ github.sha }}@${{ steps.image.outputs.digest }}
          DEPLOY_REVISION: ${{ github.sha }}
